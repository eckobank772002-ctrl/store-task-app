<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارهای فروشگاه</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid #eee;
    }

    .task:last-child {
      border-bottom: none;
    }

    .task input {
      width: 22px;
      height: 22px;
      margin: 0;
    }

    .done {
      text-decoration: line-through;
      color: #999;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c00;
      margin-top: 10px;
    }

    .success {
      color: #087f23;
      margin-top: 10px;
    }

    .logout {
      background: #777;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginBox" class="card">
    <h1>ورود به فروشگاه</h1>

    <input id="email" type="email" placeholder="ایمیل">
    <input id="password" type="password" placeholder="رمز عبور">

    <button onclick="login()">ورود</button>

    <div id="loginMessage"></div>
  </div>


  <div id="app" class="hidden">

    <h1>کارهای فروشگاه</h1>

    <button class="logout" onclick="logout()">خروج</button>

    <!-- بخش مخصوص مدیر -->
    <div id="adminPanel" class="card hidden">

      <h2>ایجاد کار جدید</h2>

      <input
        id="taskTitle"
        type="text"
        placeholder="مثلاً مرتب کردن قفسه"
      >

      <select id="employeeSelect">
        <option value="">انتخاب کارمند</option>
      </select>

      <button onclick="createTask()">ایجاد کار</button>

      <div id="createMessage"></div>

    </div>


    <div class="card">
      <h2>کارهای من</h2>
      <div id="taskList"></div>
    </div>


    <div class="card">
      <h2>انجام شده</h2>
      <div id="completedList"></div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://imzzslbklcifesvvprww.supabase.co";

/*
  این قسمت را بعداً با Publishable/Anon Key پروژه Supabase
  پر می‌کنیم.
*/
const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;


/* ---------------- LOGIN ---------------- */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if (!email || !password) {
    message.innerHTML =
      '<div class="error">ایمیل و رمز عبور را وارد کنید.</div>';
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    message.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';
    return;
  }

  currentUser = data.user;

  await startApp();
}


/* ---------------- START APP ---------------- */

async function startApp() {

  if (!currentUser) return;

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("user_id", currentUser.id)
      .single();

  if (error) {
    document.getElementById("loginMessage").innerHTML =
      '<div class="error">پروفایل کاربر پیدا نشد.</div>';
    return;
  }

  currentProfile = data;

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  if (currentProfile.role === "admin") {
    document
      .getElementById("adminPanel")
      .classList.remove("hidden");

    await loadEmployees();
  }

  await loadTasks();
}


/* ---------------- LOAD EMPLOYEES ---------------- */

async function loadEmployees() {

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("role", "employee");

  if (error) return;

  const select =
    document.getElementById("employeeSelect");

  select.innerHTML =
    '<option value="">انتخاب کارمند</option>';

  data.forEach(employee => {

    const option =
      document.createElement("option");

    option.value = employee.user_id;

    option.textContent =
      employee.name ||
      employee.user_id.substring(0, 8);

    select.appendChild(option);

  });
}


/* ---------------- LOAD TASKS ---------------- */

async function loadTasks() {

  const { data, error } =
    await supabaseClient
      .from("tasks")
      .select("*")
      .order("created_at", { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  const taskList =
    document.getElementById("taskList");

  const completedList =
    document.getElementById("completedList");

  taskList.innerHTML = "";
  completedList.innerHTML = "";

  data.forEach(task => {

    const div =
      document.createElement("div");

    div.className = "task";

    div.innerHTML = `
      <input
        type="checkbox"
        ${task.completed ? "checked" : ""}
        onchange="toggleTask('${task.id}', this.checked)"
      >

      <span class="${task.completed ? "done" : ""}">
        ${escapeHtml(task.title)}
      </span>
    `;

    if (task.completed) {
      completedList.appendChild(div);
    } else {
      taskList.appendChild(div);
    }

  });

}


/* ---------------- CREATE TASK ---------------- */

async function createTask() {

  const title =
    document.getElementById("taskTitle")
      .value.trim();

  const employeeId =
    document.getElementById("employeeSelect")
      .value;

  const message =
    document.getElementById("createMessage");

  message.innerHTML = "";

  if (!title || !employeeId) {

    message.innerHTML =
      '<div class="error">عنوان کار و کارمند را انتخاب کنید.</div>';

    return;
  }


  const { error } =
    await supabaseClient
      .from("tasks")
      .insert({
        title: title,
        assigned_user_id: employeeId,
        completed: false
      });


  if (error) {

    message.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

    return;
  }


  document.getElementById("taskTitle").value = "";

  message.innerHTML =
    '<div class="success">کار با موفقیت ایجاد شد.</div>';

  await loadTasks();
}


/* ---------------- COMPLETE TASK ---------------- */

async function toggleTask(id, completed) {

  const { error } =
    await supabaseClient
      .from("tasks")
      .update({
        completed: completed
      })
      .eq("id", id);

  if (error) {
    console.log(error);
    return;
  }

  await loadTasks();
}


/* ---------------- LOGOUT ---------------- */

async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");
}


/* ---------------- SECURITY ---------------- */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* ---------------- SESSION ---------------- */

supabaseClient.auth.getSession()
  .then(async ({ data }) => {

    if (data.session) {

      currentUser =
        data.session.user;

      await startApp();

    }

  });

</script>

</body>
</html>
